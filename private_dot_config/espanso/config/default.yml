# espanso configuration file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# Espanso cannot detect the layout on Wayland. The layout must match the xkb
# configuration of niri. Run .system/70-xkb-zok.sh to install it in /etc/xkb.
keyboard_layout:
  layout: zok

show_notifications: false
