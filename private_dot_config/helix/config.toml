theme = "catppuccin_macchiato"

[editor]
color-modes = true
cursorline = true
rulers = [80, 100, 120]
trim-trailing-whitespace = true
insert-final-newline = true
trim-final-newlines = false

preview-completion-insert = false

[editor.auto-save]
after-delay.enable = true
focus-lost = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
"[" = { "[" = "select_prev_sibling" }
"]" = { "]" = "select_next_sibling" }

S-up = "select_line_above"
S-down = "select_line_below"

[keys.normal.space.space]
# Custom shortcuts.

w = ":w"
f = ":format"
R = [":reload-all", ":config-reload", ":lsp-restart"]

"/" = ":sh ~/.sh/term-run -- scooter" # Run scooter (find and replace).
L = ":sh ~/.sh/term-run -- lf $(dirname %{buffer_name})" # Open lf in the dir of current buffer.
l = ":sh ~/.sh/term-run -- lf" # Open lf.

T = ":sh ~/.sh/term-run --cwd $(dirname %{buffer_name}) -- fish"
t = ":sh ~/.sh/term-run -- fish"

k = "remove_selections" # Default binding conflicts with zellij.

[keys.select.space.space]
k = "remove_selections" # Default binding conflicts with zellij.


[keys.select.space.space.r]
# Rendering.

w = ":toggle whitespace.render all none" # On/Off whitespace rendering.
z = ":toggle soft-wrap.enable"           # On/Off soft-wrap.

[keys.normal.space.space.r]
# Rendering.

w = ":toggle whitespace.render all none" # On/Off whitespace rendering.
z = ":toggle soft-wrap.enable"           # On/Off soft-wrap.

[keys.normal.space.space.g]
# Git helpers

g = ":sh ~/.sh/term-run -- gitu"
B = ":sh ~/.sh/term-run -- gitu blame %{buffer_name}"
b = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
d = ":sh ~/.sh/term-run -- fish -c 'git --no-pager diff -- %{buffer_name} | delta --paging=always --pager=ov'"
h = ":sh ~/.sh/term-run -- fish -c '~/.sh/git-hunk-at-line %{buffer_name} %{cursor_line} | delta --paging=always --pager=ov'"
K = ":reset-diff-change"


[keys.normal.space.q]
# Close.

q = ":quit-all"
Q = ":quit-all!"
x = ":write-quit"

