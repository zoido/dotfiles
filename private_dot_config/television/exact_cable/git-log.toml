[metadata]
name = "git-log"
description = "A channel to select from git log entries"
requirements = ["git"]

[source]
command = "git log --pretty=format:'%C(yellow)%h%Creset - %s' --abbrev-commit --color=always"
output = "{strip_ansi|split: :0}"
ansi = true
no_sort = true
frecency = false

[preview]
# command = "git show -p --stat --pretty=fuller --color=always '{strip_ansi|split: :0}' | head -n 1000"
command = [
  "git log --stat --decorate --color=always -1 '{strip_ansi|split: :0}' -- | delta",
  "git log --stat --decorate --color=always -1 -p '{strip_ansi|split: :0}' -- | delta",
]

[keybindings]
ctrl-y = "actions:copy-commit"

[actions.copy-commit]
description = "Copy the commit hash to the clipboard"
command = '''printf '\033]52;c;%s\007' "$(printf %s '{strip_ansi|split: :0}' | base64 | tr -d '\n')" > /dev/tty'''
mode = "fork"
