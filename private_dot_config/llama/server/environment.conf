# Environment for the llama-server systemd unit. The router passes it on to each model it loads.

# Keep at least 32k tokens of context. If the model does not fit in GPU memory
# with this context, --fit moves layers to system memory instead.
LLAMA_ARG_FIT_CTX=32768

# Use one request slot, so that all context goes to one request.
LLAMA_ARG_N_PARALLEL=1
