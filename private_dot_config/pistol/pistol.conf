text/* bat --paging=never --color=always --style=-full %pistol-filename%
image/* sh: kitten icat --clear --stdin no --transfer-mode memory --place %pistol-extra0%x%pistol-extra1%@%pistol-extra2%x%pistol-extra3% %pistol-filename% </dev/null >/dev/tty; exit 1
video/* sh: ~/.sh/lf-thumb-video %pistol-filename% %pistol-extra0% %pistol-extra1% %pistol-extra2% %pistol-extra3%
audio/* sh: ~/.sh/lf-thumb-audio %pistol-filename% %pistol-extra0% %pistol-extra1% %pistol-extra2% %pistol-extra3%
application/pdf sh: ~/.sh/lf-thumb-pdf %pistol-filename% %pistol-extra0% %pistol-extra1% %pistol-extra2% %pistol-extra3%
