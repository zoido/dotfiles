worktree-path = "{{ repo_path }}/../.worktrees/{{ repo }}/{{ branch | sanitize }}"


[commit]
stage = "all"

[commit.generation]
command = "pi -p --no-session --no-tools --no-extensions --no-skills --no-context-files --model github-copilot/claude-haiku-5.5"

[post-start]
copy = "wt step copy-ignored"

[list]
summary = true

[merge]
remove = false
