defaults:
  prApproveComment: ""
pager:
  diff: diffnav

prSections:
  - title: Review
    filters: is:open review-requested:@me
             -author:app/dependabot -author:app/github-actions
  - title: Review (bots)
    filters: is:open review-requested:@me
             author:app/dependabot author:app/github-actions
  - title: My
    filters: is:open author:@me
  - title: My (approved)
    filters: is:open author:@me review:approved
  - title: All Open
    filters: is:open

repoPaths:
  h2oai/*: ~/dev/h2o.ai/*
  zoido/*: ~/dev/zoido/*

keybindings:
  prs:
    - key: F
      builtin: "approveWorkflows"
    - key: T
      name: Actions
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}
    - key: M
      name: Auto Merge
      command: >
        zellij run -c --floating --cwd {{.RepoPath}} -- env GH_REPO={{.RepoName}}
        fish -c "
        confirm-pr {{.PrNumber}} 'Auto merge' || exit 0;
        auto-merge-pr {{.PrNumber}} || read -P 'Press enter to close...'
        "
    - key: V
      name: Approve & Auto Merge
      command: >
        zellij run -c --floating --cwd {{.RepoPath}} -- env GH_REPO={{.RepoName}}
        fish -c "
        confirm-pr {{.PrNumber}} 'Rebase, approve & auto merge' || exit 0;
        approve-and-merge-pr {{.PrNumber}} || read -P 'Press enter to close...'
        "
    - key: U
      name: Rebase, Re-sign & Push
      command: >
        zellij run -c --floating --cwd {{.RepoPath}} -- env GH_REPO={{.RepoName}}
        fish -c "
        confirm-pr {{.PrNumber}} 'Rebase, re-sign & force push' || exit 0;
        rebase-and-push-pr {{.PrNumber}} || read -P 'Press enter to close...'
        "
    - key: D
      name: Review (tuicr)
      command: >
        zellij run -c --stacked --cwd {{.RepoPath}} -- fish -c "tuicr pr {{.PrNumber}}"
    - key: z
      name: PR Branch Shell
      command: >
        zellij run -c --cwd {{.RepoPath}} -- fish -c "wt switch pr:{{.PrNumber}} -x fish" > /dev/null
    - key: Z
      name: Review Branch Shell
      command: >
        set output (git -C {{.RepoPath}} fetch --all 2>&1); or echo $output;
        set output (wt switch -C {{.RepoPath}} --create lp/review/{{.HeadRefName}} --base {{.HeadRefName}} 2>&1); or echo $output;
        zellij run -c --cwd {{.RepoPath}} -- fish -c "wt switch lp/review/{{.HeadRefName}} -x fish" > /dev/null

theme:
  colors:
    text:
      primary: "#cad3f5"
      secondary: "#b7bdf8"
      inverted: "#181926"
      faint: "#b8c0e0"
      warning: "#eed49f"
      success: "#a6da95"
      error: "#ed8796"
    background:
      selected: "#363a4f"
    border:
      primary: "#b7bdf8"
      secondary: "#494d64"
      faint: "#363a4f"
