conf .defaults
conf home-bin

mode strict
jail assistant

# The assistant can read the Obsidian vault but cannot change it.
rdir Obsidian/Default

# The kagi MCP server reads the session link from this directory.
rdir .config/kagi-cli

dir! .pi/assistant
rdir .local/share/chezmoi/dot_pi/assistant/

unsetenv ZELLIJ*
